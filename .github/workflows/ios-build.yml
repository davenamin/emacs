# iOS cross-build CI for the claude/ios-port branch.
#
# Runs `make ios` on a GitHub-hosted macOS runner.  The workflow
# installs the build dependencies via Homebrew, points
# xcode-select at the latest Xcode, then runs the same recipe a
# developer would run by hand:
#
#   ./autogen.sh
#   mkdir -p build-ios && cd build-ios
#   ../configure --with-ios
#   make ios
#
# On success the assembled Emacs.app bundle is uploaded as an
# artifact (capped at a few MB -- the Mach-O itself, plus the
# bundle template).  On failure the tail of make-ios.out is
# surfaced in the job summary.

name: iOS cross-build

on:
  push:
    branches:
      - claude/ios-port
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build dependencies
        run: |
          brew update
          brew install automake autoconf libtool pkg-config texinfo

      - name: Regenerate configure
        run: ./autogen.sh

      # The TLS dependency stack (gmp, nettle, gnutls) is a
      # ~10-minute build from source, so cache the installed
      # prefix keyed on the build script; build-deps.sh is a fast
      # no-op on a cache hit.
      - name: Cache iOS TLS deps
        uses: actions/cache@v4
        with:
          path: ios-deps
          key: ios-deps-iphoneos-${{ runner.os }}-${{ hashFiles('ios/build-deps.sh') }}

      - name: Build TLS deps (gmp, nettle, gnutls)
        run: |
          ios/build-deps.sh --sdk iphoneos \
            --prefix "$GITHUB_WORKSPACE/ios-deps/iphoneos"

      - name: Configure --with-ios
        id: configure
        run: |
          mkdir -p build-ios
          cd build-ios
          ../configure --with-ios \
            --with-ios-deps="$GITHUB_WORKSPACE/ios-deps/iphoneos" \
            2>&1 | tee configure.out
          tail -60 configure.out
          grep -q 'Does Emacs use -lgnutls?[[:space:]]*yes' configure.out || {
            echo '::error::iOS configure did not enable GnuTLS'; exit 1; }
          grep -q 'Does Emacs use -lxml2?[[:space:]]*yes' configure.out || {
            echo '::error::iOS configure did not enable libxml2'; exit 1; }
          grep -q 'Does Emacs use -lsqlite3?[[:space:]]*yes' configure.out || {
            echo '::error::iOS configure did not enable sqlite3'; exit 1; }
          grep -q 'Does Emacs use -ltree-sitter?[[:space:]]*yes' configure.out || {
            echo '::error::iOS configure did not enable tree-sitter'; exit 1; }

      - name: make ios
        id: make
        run: |
          cd build-ios
          set -o pipefail
          make ios 2>&1 | tee make-ios.out

      - name: Surface failure tail
        if: failure() && steps.make.outcome == 'failure'
        run: |
          echo '## make ios failed' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### First errors' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -nE 'error:|fatal:' build-ios/make-ios.out | head -40 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Last 80 lines' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -80 build-ios/make-ios.out >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Mach-O
        if: success()
        run: |
          cd build-ios
          file ios/Emacs.app/emacs
          otool -h ios/Emacs.app/emacs
          otool -L ios/Emacs.app/emacs
          otool -l ios/Emacs.app/emacs | grep -A3 LC_BUILD_VERSION

      # This job builds against the DEVICE SDK (iphoneos -- the
      # xcode-toolchain.sh default when IOS_SDK is unset), unlike
      # ios-sim-diag.yml which builds iphonesimulator.  So a green
      # run here is the continuous verification that the device
      # compile path works.  Package the unsigned bundle as an
      # .ipa to smoke-test the ios-ipa target's ditto packaging;
      # signing needs Apple credentials CI does not hold.
      - name: Package unsigned .ipa (smoke test)
        if: success()
        run: |
          cd build-ios
          make ios-ipa 2>&1 | tail -5
          unzip -l ios/Emacs.ipa | head -12
          unzip -l ios/Emacs.ipa | grep -q 'Payload/Emacs.app/emacs' \
            || { echo 'ipa is missing Payload/Emacs.app/emacs'; exit 1; }

      - name: Upload Emacs.app artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Emacs.app
          path: build-ios/ios/Emacs.app
          if-no-files-found: error
          retention-days: 7

      - name: Upload make-ios.out on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: make-ios-out
          path: build-ios/make-ios.out
          if-no-files-found: warn
          retention-days: 7
